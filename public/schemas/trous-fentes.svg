<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Sol : trous et fentes"><title>Sol : trous et fentes</title><rect width="480" height="260" fill="#fff"/><defs>
<marker id="f" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#400241"/></marker>
<marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B26A00"/></marker>
<pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9A97B3" stroke-width="2"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1B1B3D;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.c{fill:#400241;font-weight:700;font-size:15px}.t{fill:#B26A00;font-weight:700;font-size:13px}.n{font-size:12px;fill:#55536E}.g{font-size:13px;font-weight:700;fill:#1B1B3D}.s{fill:none;stroke:#2E2B57;stroke-width:2.5}.cote{stroke:#400241;stroke-width:1.5;marker-start:url(#f);marker-end:url(#f)}.cotet{stroke:#B26A00;stroke-width:1.5;stroke-dasharray:5 3;marker-start:url(#fa);marker-end:url(#fa)}.zone{fill:#EDE4F3;stroke:#7E2E8E;stroke-width:1.5;stroke-dasharray:6 4}.zonet{fill:#F3E9DA;stroke:#B26A00;stroke-width:1.5;stroke-dasharray:6 4}.ok{fill:none;stroke:#2E7D32;stroke-width:3}.ko{fill:none;stroke:#C62828;stroke-width:3}</style>
<rect x="40" y="80" width="400" height="120" fill="#F1F0F7" stroke="#2E2B57" stroke-width="2"/><rect x="120" y="100" width="10" height="80" fill="#2E2B57"/><rect x="142" y="100" width="10" height="80" fill="#2E2B57"/><rect x="164" y="100" width="10" height="80" fill="#2E2B57"/><rect x="186" y="100" width="10" height="80" fill="#2E2B57"/><rect x="208" y="100" width="10" height="80" fill="#2E2B57"/><rect x="230" y="100" width="10" height="80" fill="#2E2B57"/><rect x="252" y="100" width="10" height="80" fill="#2E2B57"/><rect x="274" y="100" width="10" height="80" fill="#2E2B57"/><rect x="296" y="100" width="10" height="80" fill="#2E2B57"/><rect x="318" y="100" width="10" height="80" fill="#2E2B57"/><line class="cote" x1="130" y1="210" x2="142" y2="210"/><text class="c" x="150" y="226">fente ou trou ≤ 2 cm</text><text class="n" x="20" y="34">Grilles, caniveaux, joints : largeur ou diamètre ≤ 2 cm</text><text class="n" x="20" y="51">Sol non meuble, non glissant, non réfléchissant,</text><text class="n" x="20" y="68">sans obstacle à la roue</text>
