<path d="M20 90 H120 V114 H146 V138 H172 V162 H198 V186 H224 V210 H290 V250 H20 Z" fill="url(#h)"/><path class="s" d="M20 90 H120 V114 H146 V138 H172 V162 H198 V186 H224 V210 H290"/><rect x="56" y="85" width="44" height="5" fill="#F5B21A"/><path d="M94 42 H120 L224 138 H250" fill="none" stroke="#7E2E8E" stroke-width="4"/><line class="cote" x1="172" y1="92" x2="172" y2="160"/><line x1="174" y1="126" x2="250" y2="176" stroke="#400241" stroke-width="1"/><text class="c" x="250" y="190">0,80 à 1,00 m</text><text class="n" x="250" y="208">mesurée au nez de marche</text><line class="cote" x1="100" y1="74" x2="120" y2="74"/><text class="c" x="50" y="70">0,50 m</text><text class="n" x="20" y="120">éveil de vigilance</text><text class="n" x="20" y="136">en haut et à chaque palier</text><text class="c" x="300" y="34">Main courante</text><text class="n" x="300" y="52">des 2 côtés si l ≥ 1,20 m</text><text class="n" x="300" y="70">continue, rigide, préhensible</text><text class="n" x="300" y="88">prolongée d&#x27;une marche</text><text class="n" x="300" y="106">en haut et en bas</text><text class="n" x="300" y="124">contrastée avec la paroi</text><text class="n" x="300" y="240">Garde-corps tenant lieu de</text><text class="n" x="300" y="255">main courante : ≥ 1,00 m</text>
