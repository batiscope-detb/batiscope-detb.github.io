<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Porte : poignée, effort d&#x27;ouverture, contraste"><title>Porte : poignée, effort d&#x27;ouverture, contraste</title><rect width="480" height="260" fill="#fff"/><defs>
