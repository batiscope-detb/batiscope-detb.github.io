<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Hauteur libre sous obstacle"><title>Hauteur libre sous obstacle</title><rect width="480" height="260" fill="#fff"/><defs>
