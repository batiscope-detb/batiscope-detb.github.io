<marker id="fa" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B26A00"/></marker>
<pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9A97B3" stroke-width="2"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1B1B3D;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.c{fill:#400241;font-weight:700;font-size:15px}.t{fill:#B26A00;font-weight:700;font-size:13px}.n{font-size:12px;fill:#55536E}.g{font-size:13px;font-weight:700;fill:#1B1B3D}.s{fill:none;stroke:#2E2B57;stroke-width:2.5}.cote{stroke:#400241;stroke-width:1.5;marker-start:url(#f);marker-end:url(#f)}.cotet{stroke:#B26A00;stroke-width:1.5;stroke-dasharray:5 3;marker-start:url(#fa);marker-end:url(#fa)}.zone{fill:#EDE4F3;stroke:#7E2E8E;stroke-width:1.5;stroke-dasharray:6 4}.zonet{fill:#F3E9DA;stroke:#B26A00;stroke-width:1.5;stroke-dasharray:6 4}.ok{fill:none;stroke:#2E7D32;stroke-width:3}.ko{fill:none;stroke:#C62828;stroke-width:3}</style>
<rect x="40" y="20" width="220" height="220" fill="#F1F0F7" stroke="#2E2B57" stroke-width="2"/><rect x="80" y="70" width="140" height="170" fill="#C9C6DA" stroke="#2E2B57" stroke-width="2"/><line x1="150" y1="70" x2="150" y2="240" stroke="#2E2B57" stroke-width="2"/><rect x="110" y="30" width="80" height="30" fill="#1B1B3D"/><text x="124" y="54" style="fill:#F5B21A;stroke:none;font:700 22px Arial">▲ 2</text><rect x="232" y="130" width="18" height="40" rx="3" fill="#2E2B57"/><circle cx="241" cy="140" r="5" fill="#F5B21A"/><circle cx="241" cy="160" r="5" fill="#F5B21A"/><text class="c" x="272" y="34">Flèches palières ≥ 40 mm</text><text class="n" x="272" y="54">+ signal sonore montée / descente</text><text class="c" x="272" y="74">Chiffres cabine 30 à 60 mm</text><text class="n" x="272" y="94">Message vocal à l&#x27;arrêt</text><text class="n" x="272" y="114">Signal sonore d&#x27;ouverture</text><text class="c" x="272" y="134">Son réglable 35 à 65 dB(A)</text><text class="n" x="272" y="154">Secours : pictos jaune / vert</text><text class="n" x="272" y="174">Étage indiqué en relief</text><text class="n" x="272" y="194">sur chaque palier</text><text class="c" x="272" y="214">Commandes 0,90 à 1,30 m</text>
