</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1B1B3D;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.c{fill:#400241;font-weight:700;font-size:15px}.t{fill:#B26A00;font-weight:700;font-size:13px}.n{font-size:12px;fill:#55536E}.g{font-size:13px;font-weight:700;fill:#1B1B3D}.s{fill:none;stroke:#2E2B57;stroke-width:2.5}.cote{stroke:#400241;stroke-width:1.5;marker-start:url(#f);marker-end:url(#f)}.cotet{stroke:#B26A00;stroke-width:1.5;stroke-dasharray:5 3;marker-start:url(#fa);marker-end:url(#fa)}.zone{fill:#EDE4F3;stroke:#7E2E8E;stroke-width:1.5;stroke-dasharray:6 4}.zonet{fill:#F3E9DA;stroke:#B26A00;stroke-width:1.5;stroke-dasharray:6 4}.ok{fill:none;stroke:#2E7D32;stroke-width:3}.ko{fill:none;stroke:#C62828;stroke-width:3}</style>
<rect x="20" y="30" width="200" height="20" fill="url(#h)" stroke="#2E2B57" stroke-width="2"/><rect x="20" y="210" width="200" height="20" fill="url(#h)" stroke="#2E2B57" stroke-width="2"/><rect x="280" y="30" width="180" height="20" fill="url(#h)" stroke="#2E2B57" stroke-width="2"/><rect x="280" y="210" width="180" height="20" fill="url(#h)" stroke="#2E2B57" stroke-width="2"/><rect x="20" y="50" width="0" height="0"/><circle cx="250" cy="130" r="72" fill="none" stroke="#400241" stroke-width="1.5" stroke-dasharray="6 4"/><line class="cote" x1="178" y1="130" x2="322" y2="130"/><text class="c" x="330" y="150">Ø 1,50 m</text><g><rect x="220" y="85" width="36.0" height="60.0" rx="3.5999999999999996" fill="#fff" stroke="#2E2B57" stroke-width="1.5"/><rect x="222.4" y="95.8" width="4.8" height="28.799999999999997" rx="1.7999999999999998" fill="#2E2B57"/><rect x="248.8" y="95.8" width="4.8" height="28.799999999999997" rx="1.7999999999999998" fill="#2E2B57"/><circle cx="238.0" cy="109.0" r="7.8" fill="#C9C6DA"/><rect x="229.6" y="127.0" width="16.8" height="13.2" rx="1.7999999999999998" fill="none" stroke="#2E2B57"/></g><text class="n" x="20" y="252">À chaque choix d&#x27;itinéraire, devant les portes, tous les 6 m dans les allées</text><text class="t" x="330" y="80">chevauchement</text><text class="t" x="330" y="96">≤ 25 cm avec le</text><text class="t" x="330" y="112">débattement de porte</text>
