<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-label="Espace de demi-tour Ø 1,50 m"><title>Espace de demi-tour Ø 1,50 m</title><rect width="480" height="260" fill="#fff"/><defs>
