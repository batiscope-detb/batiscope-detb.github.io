<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#400241" />
  <title>Batiscope</title>
  <link rel="icon" type="image/svg+xml" href="./batiscope.svg" />
  <link rel="icon" type="image/png" href="./embleme.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" id="manifeste" href="./manifest.webmanifest" />
  <script>
    // Ouvert sur Visibat : l'installation sur l'écran d'accueil crée l'icône « Visibat », distincte de Batiscope.
    if (/app=visibat/.test(location.search) || location.hash.indexOf('#/visibat') === 0) {
      document.getElementById('manifeste').href = './visibat.webmanifest'
      document.title = 'Visibat'
    }
  </script>
</head>
<body>
  <div id="racine"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
